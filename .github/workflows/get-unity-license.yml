name: Get Unity License File

on:
  workflow_dispatch:

jobs:
  get-license:
    runs-on: ubuntu-latest
    steps:
      - name: Request Unity license file (.alf)
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2021.3.45f1

      - name: Upload .alf file
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v2021.3.45f1.alf
          path: Unity_v2021.3.45f1.alf
